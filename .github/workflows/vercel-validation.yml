name: Vercel build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movieshub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movieshub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
        run: npx prisma generate
      - name: Prepare isolated integration database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
        run: npx prisma db push --skip-generate
      - name: Database integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
          MOVIESHUB_E2E: "true"
          RATE_LIMIT_SECRET: ci-only-rate-limit-secret-value-with-more-than-32-characters
        run: npm run test:integration
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build Next.js application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
          NEXTAUTH_SECRET: ci-only-secret-value-with-more-than-32-characters
          NEXTAUTH_URL: https://example.vercel.app
          NEXT_PUBLIC_APP_URL: https://example.vercel.app
          DEMO_MODE: "false"
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/movieshub_test
          MOVIESHUB_E2E: "true"
          RATE_LIMIT_SECRET: ci-only-rate-limit-secret-value-with-more-than-32-characters
          CRON_SECRET: ci-only-cron-secret-value-with-more-than-32-characters
          NEXTAUTH_SECRET: ci-only-secret-value-with-more-than-32-characters
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          DEMO_MODE: "false"
        run: npm run test:e2e
