name: Vercel build and security validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movieshub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movieshub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/movieshub_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/movieshub_test?schema=public
      NEXTAUTH_SECRET: ci-only-secret-value-with-more-than-32-characters
      CRON_SECRET: ci-only-cron-secret-value-with-more-than-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_EMAIL_VERIFICATION: "false"
      MOVIESHUB_E2E: "true"
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to isolated CI database
        run: npx prisma migrate deploy

      - name: Verify migration state
        run: npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and security primitive tests
        run: npm run test

      - name: Database security integration tests
        run: npm run test:integration

      - name: Build Next.js application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser authentication and security tests
        run: npm run test:e2e
